{% extends 'base.html' %}
{% block content %}
<nav aria-label="breadcrumb" class="mb-3">
  <ol class="breadcrumb small">
    <li class="breadcrumb-item"><a href="/" class="text-decoration-none">Home</a></li>
    <li class="breadcrumb-item active" aria-current="page">Tiendas</li>
  </ol>
</nav>

<h3 class="fw-bold mb-4">🏪 Tiendas</h3>

<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
    {% for store in stores %}
    <div class="col">
        <a href="/stores/{{ store.store_id }}" class="text-decoration-none">
            <div class="card h-100 shadow-sm hover-shadow transition-all border-0">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <span class="badge text-bg-light border text-uppercase">{{ store.type }}</span>
                    </div>
                    <h5 class="fw-bold text-body mb-1">{{ store.name }}</h5>
                    <div class="small text-secondary">{{ store.store_id }}</div>
                </div>
                <div class="card-footer bg-transparent border-top-0 pt-0 text-secondary small">
                    <span class="fw-bold">{{ store.products }}</span> productos registrados
                </div>
            </div>
        </a>
    </div>
    {% endfor %}
</div>
{% if not stores %}
    <div class="alert alert-secondary text-center">No hay tiendas disponibles.</div>
{% endif %}
{% endblock %}
