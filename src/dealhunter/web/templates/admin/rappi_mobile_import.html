<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Importar sesión Rappi - DealHunter</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
        .status { padding: 1rem; border: 1px solid #ccc; border-radius: .5rem; }
        a { color: inherit; }
    </style>
</head>
<body>
    <h1>DealHunter · Rappi</h1>
    <div id="mobile-import-status" class="status">Procesando importación local…</div>
    <p><a href="/admin/account">Volver a Cuentas / Proveedores</a></p>
<script>
(() => {
    const box = document.getElementById('mobile-import-status');
    const payload = location.hash.length > 1 ? location.hash.substring(1) : '';
    history.replaceState(null, '', location.pathname);

    if (!{{ 'true' if flow_active else 'false' }}) {
        box.textContent = 'Este flujo ya no está activo. Inícialo de nuevo desde Cuentas / Proveedores.';
        return;
    }
    if (!payload) {
        box.textContent = 'No se recibió una sesión. Vuelve a Rappi y ejecuta el bookmarklet activo.';
        return;
    }

    let decoded;
    try {
        const binary = atob(payload);
        const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
        decoded = new TextDecoder().decode(bytes);
    } catch (_) {
        box.textContent = 'El payload recibido no es válido.';
        return;
    }

    fetch('/admin/account/rappi/mobile/commit', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': {{ csrf_token|tojson }}
        },
        body: decoded
    }).then(async response => {
        let data = {};
        try { data = await response.json(); } catch (_) {}
        if (!response.ok || !data.stored) {
            box.textContent = 'No se pudo guardar la sesión. Vuelve a Cuentas / Proveedores e inténtalo de nuevo.';
            return;
        }
        if (data.status === 'VALID') box.textContent = 'Sesión guardada y verificada. Volviendo a DealHunter…';
        else if (data.status === 'UNVERIFIED') box.textContent = 'Sesión guardada; la validación remota fue inconclusa. Volviendo a DealHunter…';
        else if (data.status === 'EXPIRED') box.textContent = 'La sesión fue rechazada como expirada. Volviendo a DealHunter…';
        else box.textContent = 'La sesión se guardó, pero la validación terminó con error. Volviendo a DealHunter…';
        setTimeout(() => window.location.replace('/admin/account'), 900);
    }).catch(() => {
        box.textContent = 'No se pudo completar la importación local. Vuelve a Cuentas / Proveedores.';
    });
})();
</script>
</body>
</html>
